aid: frameio
name: Frame.io
description: 'Frame.io is a cloud-based video review and collaboration platform, now
  part of Adobe, used by video and media production teams to upload media, leave frame-accurate
  comments, manage versions, and route work through review and approval. Its V4 developer
  platform exposes a REST API (base https://api.frame.io/v4) covering accounts, workspaces,
  projects, folders, files and uploads, comments, version stacks, shares and reviewers,
  collections, groups, custom actions, metadata fields, and webhooks. Authentication
  is OAuth2 via Adobe IMS (authorization-code for user apps and client-credentials
  for server-to-server), plus a Camera to Cloud (C2C) device-integration surface,
  an official Python SDK, the fioctl CLI, and a hosted MCP server.'
